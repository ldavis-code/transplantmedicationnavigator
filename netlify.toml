# SPA fallbacks - routes without a prerendered file get a NEUTRAL app
# shell (loading note + directory links + the app scripts), not the
# homepage file: falling back to index.html made /es/anything statically
# serve the Spanish homepage content — a soft-404 that reads as "this
# page shows the wrong thing" to crawlers and no-JS visitors. React
# renders the real page (or its localized 404) on load. The Spanish rule
# must come before the generic one.
[[redirects]]
  from = "/es/*"
  to = "/es/app-shell.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/app-shell.html"
  status = 200

# Cache static assets aggressively (1 year) - Vite adds content hashes to filenames
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache JavaScript chunks (1 year) - content-hashed
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache CSS files (1 year) - content-hashed
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Un-hashed scripts in /js (e.g. epic-connect.js) must revalidate: they are
# imported by pages at fixed URLs, so a year-old immutable copy can mismatch
# the page that imports it. This rule comes after the generic *.js rule so it
# wins for /js/*.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# The font stylesheet is served at a fixed (un-hashed) URL, so it must
# revalidate: a year-old immutable copy would keep pointing browsers at
# whatever font URLs it referenced when cached. This rule comes after the
# generic *.css rule so it wins for this path.
[[headers]]
  for = "/fonts/fonts.css"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Cache fonts (1 year)
[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images (1 year)
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML files - short cache, must revalidate
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Epic callback page - no cache
[[headers]]
  for = "/auth/epic/callback/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# Scheduled compliance checks - runs every 6 hours
[functions."compliance-checks"]
  schedule = "0 */6 * * *"

# Data retention - enforces the 24-month retention policy monthly
[functions."data-retention"]
  schedule = "0 4 1 * *"

# Pending schema migrations - applied nightly at a low-traffic hour
# (07:00 UTC = 3 AM ET in summer / 2 AM ET in winter). No-op when nothing
# is pending; see netlify/functions/run-migrations.js.
[functions."run-migrations"]
  schedule = "0 7 * * *"

# Security headers for all responses
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HSTS - Enforce HTTPS for 1 year, include subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # CSP - Control what resources can be loaded
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https: blob:; connect-src 'self' https://*.neon.tech https://www.google-analytics.com https://*.ingest.sentry.io https://fhir.epic.com https://*.epic.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://fhir.epic.com https://*.epic.com"
    # Permissions Policy - Restrict browser features
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(self), usb=()"

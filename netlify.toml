[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."*"]
  external_node_modules = ["@anthropic-ai/sdk", "@neondatabase/serverless"]
  included_files = ["src/data/medications.json", "src/data/programs.json"]

# WWW to non-WWW redirect (301 permanent) - must come first
# This ensures all traffic goes to the canonical non-www domain
[[redirects]]
  from = "https://www.transplantmedicationnavigator.com/*"
  to = "https://transplantmedicationnavigator.com/:splat"
  status = 301
  force = true

# API routes - redirect to Netlify Functions (force=true ensures these take priority)
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

# Admin API routes (specific routes before generic /api/*)
[[redirects]]
  from = "/api/admin-auth/*"
  to = "/.netlify/functions/admin-auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-api/*"
  to = "/.netlify/functions/admin-api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-licenses/*"
  to = "/.netlify/functions/admin-licenses/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin-licenses"
  to = "/.netlify/functions/admin-licenses"
  status = 200
  force = true

[[redirects]]
  from = "/api/netlify-analytics"
  to = "/.netlify/functions/netlify-analytics"
  status = 200
  force = true

# Generic API route (must come AFTER specific routes)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Outbound redirect routes for tracking program clicks
[[redirects]]
  from = "/out/copay/*"
  to = "/.netlify/functions/out-redirect"
  status = 200
  force = true

[[redirects]]
  from = "/out/foundation/*"
  to = "/.netlify/functions/out-redirect"
  status = 200
  force = true

[[redirects]]
  from = "/out/pap/*"
  to = "/.netlify/functions/out-redirect"
  status = 200
  force = true

# Spanish lives at the /es/ path prefix: scripts/prerender-seo.js writes
# every Spanish page to dist/es/<route>/index.html and Netlify serves the
# static files directly — no query parameter involved. These rules mirror
# public/_redirects (which is evaluated first); kept in both places like
# the per-page rules below.
#
# Legacy ?lang=es URLs (indexed by Google, old bookmarks and shared links)
# permanently redirect to their /es/ equivalent — one rule per published
# URL, never a catch-all: Netlify forwards the query string on redirects
# (observed live: /trumprx?lang=es 302'd to /trumprx-es?lang=es), so a
# generic /* rule would match its own /es/... target again and loop. These
# targets never re-match, and the forwarded ?lang=es left on the target
# URL is harmless (the app strips it client-side). Forced because
# non-forced rules are skipped when the path resolves to an existing
# static file; ?lang=en needs no rule — the client still honors it, and
# the plain path already serves English.
#
# /trumprx: its Spanish version is its own static page at /trumprx-es,
# not an /es/ shell page.
[[redirects]]
  from = "/trumprx"
  to = "/trumprx-es"
  status = 301
  force = true
  query = { lang = "es" }

[[redirects]]
  from = "/"
  to = "/es/"
  status = 301
  force = true
  query = { lang = "es" }

[[redirects]]
  from = "/wizard"
  to = "/es/wizard"
  status = 301
  force = true
  query = { lang = "es" }

[[redirects]]
  from = "/education"
  to = "/es/education"
  status = 301
  force = true
  query = { lang = "es" }

[[redirects]]
